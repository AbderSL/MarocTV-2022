
<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>مشاهدة القناة</title>

<style>
  body {
    margin: 0;
    background-color: #000;
    color: #fff;
    font-family: "Arial", sans-serif;
    text-align: center;
  }

  header {
    background: #222;
    padding: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
  }

  header img {
    width: 36px;
    height: 36px;
    border-radius: 8px;
  }

  header h1 {
    font-size: 16px;
    margin: 0;
  }

  video {
    width: 100%;
    height: auto;
    background: #000;
  }

  .live {
    position: absolute;
    top: 12px;
    left: 12px;
    background: red;
    color: white;
    font-weight: bold;
    padding: 4px 10px;
    border-radius: 6px;
    font-size: 12px;
  }

  .container {
    position: relative;
  }

  .status {
    padding: 12px;
    font-size: 14px;
    color: #ccc;
  }
</style>
</head>
<body>

<header>
  <img id="logo" src="https://AbderSL.github.io/MarocTV-2022/LOGO/2M.jpg" alt="logo">
  <h1 id="title">القناة</h1>
</header>

<div class="container">
  <span class="live">LIVE</span>
  <!-- muted ضروري لكي يعمل autoplay تلقائياً في أغلب المتصفحات -->
  <video id="video" controls autoplay playsinline muted></video>
</div>

<p class="status" id="status">جاري تحميل البث...</p>

<script>
  // رابط البث
  const STREAM_URL = "https://d2qh3gh0k5vp3v.cloudfront.net/v1/manifest/3722c60a815c199d9c0ef36c5b73da68a62b09d1/cc-n6pess5lwbghr/ec58ba37-5794-43e0-b4ab-5dfa2ba25331/3.m3u8";

  const video = document.getElementById("video");
  const statusEl = document.getElementById("status");

  function setStatus(text) {
    if (statusEl) statusEl.textContent = text;
  }

  function tryAutoplay() {
    const playPromise = video.play();
    if (playPromise !== undefined) {
      playPromise
        .then(() => {
          setStatus("");
        })
        .catch((err) => {
          // بعض المتصفحات تمنع autoplay حتى مع muted، نعرض رسالة بديلة
          setStatus("اضغط على زر التشغيل لبدء المشاهدة ▶️");
          console.warn("Autoplay blocked:", err);
        });
    }
  }

  function loadWithHlsJs() {
    const script = document.createElement("script");
    script.src = "https://cdn.jsdelivr.net/npm/hls.js@1.4.8";
    script.onload = () => {
      if (typeof Hls !== "undefined" && Hls.isSupported()) {
        const hls = new Hls();
        hls.loadSource(STREAM_URL);
        hls.attachMedia(video);

        hls.on(Hls.Events.MANIFEST_PARSED, () => {
          tryAutoplay();
        });

        hls.on(Hls.Events.ERROR, (event, data) => {
          if (data.fatal) {
            setStatus("انظر قليل قليل حثي يشتغل البث ✅");
            console.error("HLS fatal error:", data);
          }
        });
      } else {
        setStatus("متصفحك لا يدعم تشغيل هذا البث 😕");
      }
    };
    script.onerror = () => {
      setStatus("فشل تحميل مكتبة التشغيل، تحقق من الاتصال بالإنترنت");
    };
    document.body.appendChild(script);
  }

  function initPlayer() {
    if (video.canPlayType("application/vnd.apple.mpegurl")) {
      // دعم HLS أصلي (Safari, iOS)
      video.src = STREAM_URL;
      video.addEventListener("loadedmetadata", tryAutoplay);
      video.addEventListener("error", () => {
        setStatus(" انظر قليل قليل حثي يشتغل البث ✅");
      });
    } else {
      // باقي المتصفحات: نحمّل hls.js أولاً ثم نتحقق من دعمه
      loadWithHlsJs();
    }
  }

  initPlayer();
</script>

</body>
</html>
